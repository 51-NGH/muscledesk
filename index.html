<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>MuscleDesk — Gym Management Software for Indian Gyms</title>
    <meta name="title" content="MuscleDesk — Gym Management Software for Indian Gyms" />
    <meta name="description" content="MuscleDesk helps Indian gym owners manage members, attendance (QR & fingerprint), payments, plans, and leads from one mobile-first dashboard." />
    <link rel="canonical" href="https://muscledesk.lovable.app/" />
    <meta name="author" content="MuscleDesk" />
    
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MuscleDesk" />
    <meta name="application-name" content="MuscleDesk" />
    <meta name="msapplication-TileColor" content="#1c1c1e" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    
    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Manifest is set by inline script below based on route -->
    <link rel="manifest" href="/manifest-admin.json" id="pwa-manifest" />
    
    <!-- CRITICAL: Set correct manifest BEFORE browser checks PWA installability -->
    <script>
      (function() {
        var path = window.location.pathname;
        var isMemberPortal = path.startsWith('/member');
        var manifest = document.getElementById('pwa-manifest');
        if (manifest) {
          manifest.href = isMemberPortal ? '/manifest-member.json' : '/manifest-admin.json';
        }
        // Also update apple-touch-icon
        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleIcon) {
          appleIcon.href = isMemberPortal ? '/member-apple-touch-icon.png' : '/apple-touch-icon.png';
        }
        // Update theme color
        var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
        themeMetas.forEach(function(meta) {
          if (isMemberPortal) {
            meta.content = '#10b981';
          }
        });
        // Update title
        if (isMemberPortal) {
          document.title = 'My Gym - Member Portal';
        }
      })();
    </script>
    
    <!-- Splash Screens for iOS -->
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MuscleDesk - Gym Management" />
    <meta property="og:description" content="Complete gym management solution. Track members, payments, attendance, and more." />
    <meta property="og:image" content="/pwa-512x512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MuscleDesk - Gym Management" />
    <meta name="twitter:description" content="Complete gym management solution. Track members, payments, attendance, and more." />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    
    <!-- Preconnect to important origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <style>
      /* Safe area insets for notched devices */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      
      /* Prevent pull-to-refresh on mobile */
      html, body {
        overscroll-behavior-y: contain;
      }
      
      /* Safe area padding utility classes */
      .safe-area-pt { padding-top: env(safe-area-inset-top); }
      .safe-area-pr { padding-right: env(safe-area-inset-right); }
      .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
      .safe-area-pl { padding-left: env(safe-area-inset-left); }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
